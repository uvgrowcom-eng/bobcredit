<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding: 20px; min-height: 100vh; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header p { font-size: 13px; color: #8e8e93; }

        .gallery-btn {
            width: 100%; max-width: 500px; margin: 0 auto 20px;
            display: block; padding: 18px;
            border: none; border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.5);
        }
        .gallery-btn:active { transform: scale(0.97); }

        .status {
            text-align: center; font-size: 13px;
            color: #8e8e93; margin-bottom: 20px;
            max-width: 500px; margin-left: auto; margin-right: auto;
        }

        .file-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 4px; max-width: 500px; margin: 0 auto;
        }

        .file-item {
            aspect-ratio: 1; border-radius: 8px; overflow: hidden;
            background: #1c1c1e;
        }
        .file-item img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📸 Gallery</h1>
        <p>Apna folder select karo</p>
    </div>

    <input type="file" id="folderInput" webkitdirectory multiple hidden>
    
    <button class="gallery-btn" id="openFolderBtn">
        📂 Open Folder
    </button>

    <div class="status" id="status"></div>
    <div class="file-grid" id="fileGrid"></div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const openFolderBtn = document.getElementById('openFolderBtn');
        const fileGrid = document.getElementById('fileGrid');
        const status = document.getElementById('status');

        openFolderBtn.addEventListener('click', () => {
            folderInput.click();
        });

        folderInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            fileGrid.innerHTML = '';

            if (files.length === 0) {
                status.textContent = 'Koi file select nahi ki';
                return;
            }

            let photoCount = 0;

            files.forEach((file) => {
                if (file.type.startsWith('image/')) {
                    const url = URL.createObjectURL(file);
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `<img src="${url}" loading="lazy" alt="${file.name}">`;
                    fileGrid.appendChild(div);
                    photoCount++;
                }
            });

            status.textContent = `✅ ${photoCount} photos loaded (${files.length} total files)`;
        });
    </script>
</body>
</html>
