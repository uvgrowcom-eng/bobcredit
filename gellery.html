<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Photos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #fff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.5;
        }

        /* ===== DROP ZONE ===== */
        .dropzone {
            position: relative;
            max-width: 500px;
            width: 100%;
            margin: 0 auto 24px;
            padding: 48px 24px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .dropzone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(220, 39, 67, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .dropzone:hover::before,
        .dropzone.dragover::before {
            opacity: 1;
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: #dc2743;
            transform: translateY(-2px);
            box-shadow: 0 20px 50px rgba(220, 39, 67, 0.2);
        }

        .dropzone.dragover {
            transform: scale(1.02);
            border-style: solid;
        }

        .dropzone-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .dropzone-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .dropzone-sub {
            font-size: 13px;
            color: #8e8e93;
        }

        .dropzone-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 6px 14px;
            background: rgba(52, 168, 83, 0.12);
            border: 1px solid rgba(52, 168, 83, 0.3);
            color: #34A853;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto 24px;
            color: #5f6368;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        /* ===== OPTIONS ===== */
        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .option-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(44,44,46,0.6), rgba(28,28,30,0.6));
            color: #fff;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(240, 148, 51, 0.1), rgba(220, 39, 67, 0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .option-btn:hover {
            border-color: rgba(220, 39, 67, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.15);
        }

        .option-btn:hover::before {
            opacity: 1;
        }

        .option-btn:active {
            transform: scale(0.97);
        }

        .option-icon {
            font-size: 28px;
            position: relative;
            z-index: 1;
        }

        .option-label {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            position: relative;
            z-index: 1;
            text-align: center;
            line-height: 1.3;
        }

        /* ===== PREVIEW GRID ===== */
        .preview-section {
            max-width: 600px;
            width: 100%;
            margin: 32px auto 0;
            display: none;
        }

        .preview-section.show {
            display: block;
            animation: fadeUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .preview-title {
            font-size: 16px;
            font-weight: 700;
        }

        .preview-count {
            font-size: 13px;
            color: #8e8e93;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .preview-item {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: #1c1c1e;
            animation: itemIn 0.3s backwards;
            cursor: pointer;
        }

        @keyframes itemIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .preview-item .item-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .preview-item:hover .item-remove,
        .preview-item:active .item-remove {
            opacity: 1;
        }

        /* ===== ACTION BAR ===== */
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(180deg, transparent, #0a0a0a 30%);
            display: none;
            gap: 10px;
            z-index: 100;
        }

        .action-bar.show {
            display: flex;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .action-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            max-width: 500px;
            margin: 0 auto;
        }

        .action-btn.primary {
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.4);
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 9999;
            animation: toastIn 0.3s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(220, 39, 67, 0.15);
            border-top-color: #dc2743;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #8e8e93;
            font-size: 14px;
        }

        /* Hide inputs */
        .hidden-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Add Photos</h1>
        <p>Apni photos select karo — friends ke saath share karo</p>
    </div>

    <!-- DROP ZONE -->
    <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📸</div>
        <div class="dropzone-title">Drop photos here</div>
        <div class="dropzone-sub">ya tap karke browse karo</div>
        <div class="dropzone-badge">
            <span>🔒</span>
            <span>100% private</span>
        </div>
    </div>

    <!-- DIVIDER -->
    <div class="divider">ya chuno</div>

    <!-- OPTIONS -->
    <div class="options">
        <button class="option-btn" id="galleryBtn">
            <span class="option-icon">🖼️</span>
            <span class="option-label">Gallery</span>
        </button>
        <button class="option-btn" id="cameraBtn">
            <span class="option-icon">📷</span>
            <span class="option-label">Camera</span>
        </button>
        <button class="option-btn" id="folderBtn">
            <span class="option-icon">📁</span>
            <span class="option-label">Folder</span>
        </button>
    </div>

    <!-- PREVIEW SECTION -->
    <div class="preview-section" id="previewSection">
        <div class="preview-header">
            <div class="preview-title">Selected Photos</div>
            <div class="preview-count" id="previewCount">0 items</div>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar" id="actionBar">
        <button class="action-btn primary" id="continueBtn">
            Continue →
        </button>
    </div>

    <!-- HIDDEN INPUTS -->
    <input type="file" id="galleryInput" accept="image/*,video/*" multiple class="hidden-input">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input">
    <input type="file" id="folderInput" webkitdirectory multiple class="hidden-input">

    <script>
        /* ============================================================
           STATE
           ============================================================ */
        let selectedFiles = [];

        /* ============================================================
           DOM REFS
           ============================================================ */
        const dropzone = document.getElementById('dropzone');
        const galleryBtn = document.getElementById('galleryBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const folderBtn = document.getElementById('folderBtn');
        const galleryInput = document.getElementById('galleryInput');
        const cameraInput = document.getElementById('cameraInput');
        const folderInput = document.getElementById('folderInput');
        const previewSection = document.getElementById('previewSection');
        const previewGrid = document.getElementById('previewGrid');
        const previewCount = document.getElementById('previewCount');
        const actionBar = document.getElementById('actionBar');
        const continueBtn = document.getElementById('continueBtn');

        /* ============================================================
           TRIGGER INPUTS
           ============================================================ */
        galleryBtn.addEventListener('click', () => galleryInput.click());
        cameraBtn.addEventListener('click', () => cameraInput.click());
        folderBtn.addEventListener('click', () => folderInput.click());
        dropzone.addEventListener('click', () => galleryInput.click());

        /* ============================================================
           FILE HANDLING
           ============================================================ */
        galleryInput.addEventListener('change', (e) => {
            handleFiles(Array.from(e.target.files));
            galleryInput.value = '';
        });

        cameraInput.addEventListener('change', (e) => {
            handleFiles(Array.from(e.target.files));
            cameraInput.value = '';
        });

        folderInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
            handleFiles(files);
            folderInput.value = '';
        });

        function handleFiles(files) {
            if (files.length === 0) return;

            // Filter only images & videos
            const valid = files.filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));

            if (valid.length === 0) {
                showToast('❌ Sirf photos aur videos allowed hain');
                return;
            }

            // Add to selected
            valid.forEach(file => {
                selectedFiles.push({
                    file,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    id: Date.now() + Math.random().toString(36).substr(2, 9)
                });
            });

            renderPreview();
            showToast(`✅ ${valid.length} ${valid.length === 1 ? 'item' : 'items'} added`);
        }

        /* ============================================================
           DRAG & DROP
           ============================================================ */
        let dragCounter = 0;

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (eventName === 'dragenter') dragCounter++;
                dropzone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (eventName === 'dragleave') dragCounter--;
                if (dragCounter <= 0 || eventName === 'drop') {
                    dropzone.classList.remove('dragover');
                    dragCounter = 0;
                }
            });
        });

        dropzone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        // Prevent default drag on window
        ['dragover', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, (e) => e.preventDefault());
        });

        /* ============================================================
           RENDER PREVIEW
           ============================================================ */
        function renderPreview() {
            if (selectedFiles.length === 0) {
                previewSection.classList.remove('show');
                actionBar.classList.remove('show');
                return;
            }

            previewSection.classList.add('show');
            actionBar.classList.add('show');
            previewCount.textContent = `${selectedFiles.length} ${selectedFiles.length === 1 ? 'item' : 'items'}`;

            previewGrid.innerHTML = '';

            selectedFiles.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.style.animationDelay = `${Math.min(index * 0.03, 0.5)}s`;

                if (item.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    const url = URL.createObjectURL(item.file);
                    img.src = url;
                    img.onload = () => URL.revokeObjectURL(url);
                    div.appendChild(img);
                } else {
                    // Video — show icon
                    div.innerHTML = `
                        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1c1c1e;font-size:32px;">
                            🎬
                        </div>
                    `;
                }

                // Remove button
                const removeBtn = document.createElement('button');
                removeBtn.className = 'item-remove';
                removeBtn.textContent = '✕';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeItem(item.id);
                });
                div.appendChild(removeBtn);

                previewGrid.appendChild(div);
            });
        }

        function removeItem(id) {
            selectedFiles = selectedFiles.filter(item => item.id !== id);
            renderPreview();
            showToast('🗑️ Removed');
        }

        /* ============================================================
           CONTINUE
           ============================================================ */
        continueBtn.addEventListener('click', () => {
            if (selectedFiles.length === 0) return;

            console.log('📤 Continuing with', selectedFiles.length, 'files');
            console.log('Files:', selectedFiles.map(f => f.name));

            // Yahan apna action — upload, preview, etc.
            showToast(`✅ ${selectedFiles.length} files ready`);

            // Example: Yahan app ka next step
            // - Firebase upload
            // - Compress images
            // - Show in chat
            // - etc.
        });

        /* ============================================================
           TOAST
           ============================================================ */
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /* ============================================================
           INIT
           ============================================================ */
        console.log('✅ Photo picker ready');
        console.log('📁 Folder support:', 'webkitdirectory' in document.createElement('input'));
    </script>
</body>
</html>
