<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .header-sub {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            background: #1c1c1e;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .header-btn.primary {
            background: linear-gradient(45deg, #f09433, #dc2743);
        }

        .header-btn:active {
            transform: scale(0.95);
        }

        /* ===== PHOTO GRID ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 8px;
        }

        .photo-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #1c1c1e;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .photo-item:active {
            transform: scale(0.95);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-item .video-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 4px;
        }

        /* ===== EMPTY ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto 20px;
        }

        .empty-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(45deg, #f09433, #dc2743);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        /* ===== PERMISSION MODAL ===== */
        #permissionModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 200;
            animation: fadeIn 0.3s;
        }

        #permissionModal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .perm-popup {
            background: linear-gradient(180deg, #1c1c1e 0%, #0a0a0a 100%);
            border-radius: 28px;
            padding: 32px 24px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { transform: translateY(60px) scale(0.9); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }

        .perm-popup::before {
            content: '';
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 200px;
            background: radial-gradient(circle, rgba(26, 115, 232, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        .perm-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 24px;
            background: linear-gradient(135deg, #1a73e8, #34A853);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: 0 10px 40px rgba(26, 115, 232, 0.4);
            position: relative;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .perm-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .perm-subtitle {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        /* Options */
        .perm-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .perm-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: rgba(44, 44, 46, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: left;
            font-family: inherit;
            color: #fff;
            width: 100%;
        }

        .perm-option:hover {
            background: rgba(44, 44, 46, 0.9);
            border-color: rgba(26, 115, 232, 0.4);
            transform: translateY(-1px);
        }

        .perm-option:active {
            transform: scale(0.98);
        }

        .perm-option-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(26, 115, 232, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .perm-option-text {
            flex: 1;
            min-width: 0;
        }

        .perm-option-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
        }

        .perm-option-sub {
            font-size: 12px;
            color: #8e8e93;
            line-height: 1.4;
        }

        .perm-option-arrow {
            color: #5f6368;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Badge */
        .perm-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(52, 168, 83, 0.12);
            border: 1px solid rgba(52, 168, 83, 0.3);
            color: #34A853;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 6px;
        }

        /* Skip */
        .perm-skip {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8e8e93;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
        }

        .perm-skip:hover {
            color: #fff;
        }

        /* Trust */
        .perm-trust {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: #5f6368;
        }

        /* ===== HIDDEN INPUTS ===== */
        .hidden-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 9999;
            animation: toastIn 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== LOADING ===== */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(26, 115, 232, 0.15);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #8e8e93;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div>
            <h1 id="headerTitle">My Photos</h1>
            <div class="header-sub" id="headerSub">Koi photo nahi</div>
        </div>
        <div class="header-actions">
            <button class="header-btn primary" id="addBtn">
                <span>➕</span>
                <span>Add</span>
            </button>
        </div>
    </div>

    <!-- PHOTO GRID -->
    <div class="photo-grid" id="photoGrid">
        <div class="empty">
            <div class="empty-icon">📸</div>
            <div class="empty-title">Koi photo nahi</div>
            <div class="empty-sub">Apni poori gallery access karne ke liye button dabao</div>
            <button class="empty-btn" id="openGalleryBtn">📂 Open Gallery</button>
        </div>
    </div>

    <!-- PERMISSION MODAL -->
    <div id="permissionModal">
        <div class="perm-popup">

            <div class="perm-icon">📸</div>

            <h2 class="perm-title">Gallery Access</h2>
            <p class="perm-subtitle">
                Apni photos dekhne ke liye gallery access do.
                <strong>100% private</strong> — photos device pe hi rahengi.
            </p>

            <!-- Options -->
            <div class="perm-options">

                <!-- Option 1: Full Gallery -->
                <button class="perm-option" id="fullGalleryOption">
                    <div class="perm-option-icon">📁</div>
                    <div class="perm-option-text">
                        <div class="perm-option-title">
                            Full Gallery
                            <span class="perm-badge">ALL</span>
                        </div>
                        <div class="perm-option-sub">Poori gallery — saari photos ek saath</div>
                    </div>
                    <div class="perm-option-arrow">›</div>
                </button>

                <!-- Option 2: Select Photos -->
                <button class="perm-option" id="selectPhotosOption">
                    <div class="perm-option-icon">🖼️</div>
                    <div class="perm-option-text">
                        <div class="perm-option-title">Select Photos</div>
                        <div class="perm-option-sub">Multiple photos choose karo</div>
                    </div>
                    <div class="perm-option-arrow">›</div>
                </button>

                <!-- Option 3: Camera -->
                <button class="perm-option" id="cameraOption">
                    <div class="perm-option-icon">📷</div>
                    <div class="perm-option-text">
                        <div class="perm-option-title">Camera</div>
                        <div class="perm-option-sub">Photo khinch ke add karo</div>
                    </div>
                    <div class="perm-option-arrow">›</div>
                </button>

            </div>

            <!-- Skip -->
            <button class="perm-skip" id="skipBtn">
                Maybe later
            </button>

            <!-- Trust -->
            <div class="perm-trust">
                <span>🔒</span>
                <span>Your photos stay on your device</span>
            </div>

        </div>
    </div>

    <!-- HIDDEN INPUTS -->
    <input type="file" id="galleryInput" accept="image/*,video/*" multiple class="hidden-input">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input">
    <input type="file" id="folderInput" webkitdirectory multiple class="hidden-input">

    <script>
        /* ============================================================
           STATE
           ============================================================ */
        let allPhotos = [];
        let galleryMode = 'none'; // 'folder', 'select', 'camera'

        /* ============================================================
           DOM REFS
           ============================================================ */
        const headerTitle = document.getElementById('headerTitle');
        const headerSub = document.getElementById('headerSub');
        const addBtn = document.getElementById('addBtn');
        const openGalleryBtn = document.getElementById('openGalleryBtn');
        const photoGrid = document.getElementById('photoGrid');
        const permissionModal = document.getElementById('permissionModal');

        const fullGalleryOption = document.getElementById('fullGalleryOption');
        const selectPhotosOption = document.getElementById('selectPhotosOption');
        const cameraOption = document.getElementById('cameraOption');
        const skipBtn = document.getElementById('skipBtn');

        const galleryInput = document.getElementById('galleryInput');
        const cameraInput = document.getElementById('cameraInput');
        const folderInput = document.getElementById('folderInput');

        /* ============================================================
           INDEXEDDB — folder handle save karne ke liye
           ============================================================ */
        const DB_NAME = 'gallery_db';
        const DB_VERSION = 1;
        const STORE_NAME = 'handles';
        const HANDLE_KEY = 'gallery_folder';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveHandle(key, handle) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(handle, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getHandle(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        /* ============================================================
           MODAL
           ============================================================ */
        function showModal() {
            permissionModal.classList.add('show');
        }

        function hideModal() {
            permissionModal.classList.remove('show');
        }

        /* ============================================================
           OPEN GALLERY — user ne button dabaya
           ============================================================ */
        openGalleryBtn.addEventListener('click', () => {
            if (hasGalleryAccess()) {
                showModal();
            } else {
                showModal();
            }
        });

        addBtn.addEventListener('click', () => {
            showModal();
        });

        /* ============================================================
           OPTIONS — user ne kuch choose kiya
           ============================================================ */

        // Option 1: FULL GALLERY (File System Access API)
        fullGalleryOption.addEventListener('click', async () => {
            console.log('📁 Full gallery mode');

            if (!window.showDirectoryPicker) {
                showToast('❌ Full gallery support nahi hai is browser mein');
                return;
            }

            hideModal();

            try {
                // Check saved handle
                const saved = await getHandle(HANDLE_KEY);

                if (saved) {
                    const perm = await saved.queryPermission({ mode: 'read' });
                    if (perm === 'granted') {
                        await loadFromFolder(saved);
                        return;
                    }
                }

                // Naya folder picker
                const dirHandle = await window.showDirectoryPicker({
                    mode: 'read',
                    startIn: 'pictures'
                });

                await saveHandle(HANDLE_KEY, dirHandle);
                await loadFromFolder(dirHandle);

            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error('Error:', err);
                showToast('❌ Error: ' + err.message);
            }
        });

        // Option 2: SELECT PHOTOS
        selectPhotosOption.addEventListener('click', () => {
            console.log('🖼️ Select mode');
            hideModal();
            setTimeout(() => galleryInput.click(), 200);
        });

        // Option 3: CAMERA
        cameraOption.addEventListener('click', () => {
            console.log('📷 Camera mode');
            hideModal();
            setTimeout(() => cameraInput.click(), 200);
        });

        // Skip
        skipBtn.addEventListener('click', () => {
            hideModal();
            showToast('📸 Gallery skip ki');
        });

        /* ============================================================
           LOAD FROM FOLDER — File System Access API
           ============================================================ */
        async function loadFromFolder(dirHandle) {
            photoGrid.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Photos load ho rahi hain...</div>
                </div>
            `;

            try {
                // Check permission
                const perm = await dirHandle.queryPermission({ mode: 'read' });
                if (perm !== 'granted') {
                    const req = await dirHandle.requestPermission({ mode: 'read' });
                    if (req !== 'granted') {
                        showToast('❌ Permission denied');
                        renderEmpty();
                        return;
                    }
                }

                const files = [];

                // Recursively collect all files
                async function collectFiles(handle, path = '') {
                    for await (const entry of handle.values()) {
                        if (entry.kind === 'file') {
                            if (/\.(jpg|jpeg|png|gif|webp|heic|bmp|mp4|mov|avi|mkv|webm)$/i.test(entry.name)) {
                                files.push(entry);
                            }
                        } else if (entry.kind === 'directory') {
                            // Sub-folder mein jao
                            try {
                                await collectFiles(entry, path + entry.name + '/');
                            } catch (e) {
                                console.warn('Skipping folder:', entry.name);
                            }
                        }
                    }
                }

                await collectFiles(dirHandle);

                console.log(`📁 Found ${files.length} files`);

                if (files.length === 0) {
                    photoGrid.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">Koi photo nahi mili</div>
                            <div class="empty-sub">Is folder mein photos nahi hain</div>
                        </div>
                    `;
                    return;
                }

                // Clear grid
                photoGrid.innerHTML = '';
                allPhotos = [];

                // Sort by name (newest first)
                files.sort((a, b) => b.name.localeCompare(a.name));

                let photoCount = 0;
                let videoCount = 0;

                // Render one by one
                for (const entry of files) {
                    try {
                        const file = await entry.getFile();
                        const url = URL.createObjectURL(file);
                        const isVideo = /\.(mp4|mov|avi|mkv|webm)$/i.test(entry.name);

                        allPhotos.push({ file, url, name: entry.name, isVideo });

                        const div = document.createElement('div');
                        div.className = 'photo-item';

                        if (isVideo) {
                            div.innerHTML = `
                                <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1c1c1e;font-size:36px;">
                                    🎬
                                </div>
                                <div class="video-badge">VIDEO</div>
                            `;
                            videoCount++;
                        } else {
                            const img = document.createElement('img');
                            img.loading = 'lazy';
                            img.src = url;
                            div.appendChild(img);
                            photoCount++;
                        }

                        photoGrid.appendChild(div);

                        // UI yield every 20
                        if ((photoCount + videoCount) % 20 === 0) {
                            await new Promise(r => setTimeout(r, 1));
                        }

                    } catch (e) {
                        console.warn('Skip:', entry.name);
                    }
                }

                // Update header
                headerTitle.textContent = dirHandle.name || 'Gallery';
                headerSub.textContent = `${photoCount} photos • ${videoCount} videos`;

                showToast(`✅ ${photoCount + videoCount} items loaded`);

            } catch (err) {
                console.error('Load error:', err);
                showToast('❌ Error: ' + err.message);
            }
        }

        /* ============================================================
           GALLERY INPUT (Select Photos mode)
           ============================================================ */
        galleryInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleSelectedFiles(files);
            galleryInput.value = '';
        });

        cameraInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleSelectedFiles(files);
            cameraInput.value = '';
        });

        function handleSelectedFiles(files) {
            if (files.length === 0) return;

            const valid = files.filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));

            if (valid.length === 0) {
                showToast('❌ Sirf photos aur videos allowed hain');
                return;
            }

            // Clear empty state
            if (allPhotos.length === 0) {
                photoGrid.innerHTML = '';
            }

            let photoCount = 0;
            let videoCount = 0;

            valid.forEach((file) => {
                const url = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video/');

                allPhotos.push({ file, url, name: file.name, isVideo });

                const div = document.createElement('div');
                div.className = 'photo-item';

                if (isVideo) {
                    div.innerHTML = `
                        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1c1c1e;font-size:36px;">
                            🎬
                        </div>
                        <div class="video-badge">VIDEO</div>
                    `;
                    videoCount++;
                } else {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = url;
                    div.appendChild(img);
                    photoCount++;
                }

                photoGrid.appendChild(div);
            });

            // Update header
            headerTitle.textContent = 'My Photos';
            headerSub.textContent = `${allPhotos.length} items`;

            showToast(`✅ ${valid.length} ${valid.length === 1 ? 'item' : 'items'} added`);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        function renderEmpty() {
            photoGrid.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📸</div>
                    <div class="empty-title">Koi photo nahi</div>
                    <div class="empty-sub">Apni poori gallery access karne ke liye button dabao</div>
                    <button class="empty-btn" onclick="document.getElementById('permissionModal').classList.add('show')">
                        📂 Open Gallery
                    </button>
                </div>
            `;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* ============================================================
           PERMISSION CHECK
           ============================================================ */
        function hasGalleryAccess() {
            return localStorage.getItem('gallery_access') === 'granted';
        }

        /* ============================================================
           INIT
           ============================================================ */
        async function init() {
            console.log('🚀 Initializing gallery...');

            // Check saved folder
            try {
                const saved = await getHandle(HANDLE_KEY);
                if (saved) {
                    const perm = await saved.queryPermission({ mode: 'read' });
                    if (perm === 'granted') {
                        console.log('✅ Saved folder found, loading...');
                        await loadFromFolder(saved);
                        return;
                    }
                }
            } catch (e) {
                console.warn('Init error:', e);
            }

            // Show modal after short delay
            setTimeout(() => showModal(), 500);
        }

        init();
    </script>
</body>
</html>
