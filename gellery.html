<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: #8e8e93;
        }

        .open-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.4);
            font-family: inherit;
            animation: gradientMove 4s ease infinite;
            transition: transform 0.15s;
        }

        .open-btn:active {
            transform: scale(0.97);
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            max-width: 600px;
            margin: 0 auto;
        }

        .item {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #1c1c1e;
            position: relative;
            animation: itemIn 0.3s backwards;
        }

        @keyframes itemIn {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item .video-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c1c1e;
            font-size: 36px;
        }

        .item .badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            padding: 3px 7px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            border-radius: 5px;
            text-transform: uppercase;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #8e8e93;
            font-size: 14px;
        }

        .hidden {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 44, 46, 0.95);
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 9999;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: toastIn 0.3s;
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📸 My Gallery</h1>
        <p>Folder select karo — saari photos dikhengi</p>
    </div>

    <!-- 🔥 HIDDEN INPUT — Ye trick warning nahi aane deti -->
    <input 
        type="file" 
        id="folderInput" 
        webkitdirectory 
        multiple
        class="hidden"
    >

    <button class="open-btn" id="openBtn">
        📁 Open Gallery
    </button>

    <div class="status" id="status"></div>

    <div class="grid" id="grid">
        <div class="empty">
            <div style="font-size:48px;margin-bottom:12px;opacity:0.4;">📁</div>
            <div>Folder select karne ke liye button dabao</div>
        </div>
    </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const openBtn = document.getElementById('openBtn');
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');

        // 🔥 Button click → system picker (NO WARNING)
        openBtn.addEventListener('click', () => {
            folderInput.click();
        });

        // 🔥 Files aayi
        folderInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            if (files.length === 0) {
                status.textContent = 'Koi folder select nahi kiya';
                return;
            }

            // Get folder name
            const firstPath = files[0].webkitRelativePath || '';
            const folderName = firstPath.split('/')[0] || 'Selected Folder';

            status.textContent = `📁 ${folderName} • Processing...`;

            // Filter only images and videos
            const validFiles = files.filter(f => 
                f.type.startsWith('image/') || f.type.startsWith('video/')
            );

            if (validFiles.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div style="font-size:48px;margin-bottom:12px;opacity:0.4;">📭</div>
                        <div>Is folder mein photos nahi hain</div>
                    </div>
                `;
                status.textContent = `${files.length} files mile, but koi photo nahi`;
                return;
            }

            // Clear grid
            grid.innerHTML = '';

            let photoCount = 0;
            let videoCount = 0;

            // Render files
            validFiles.forEach((file, index) => {
                const isImage = file.type.startsWith('image/');
                const isVideo = file.type.startsWith('video/');
                const ext = file.name.split('.').pop().toLowerCase();

                const div = document.createElement('div');
                div.className = 'item';
                div.style.animationDelay = `${Math.min(index * 0.005, 0.3)}s`;

                if (isImage) {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    const url = URL.createObjectURL(file);
                    img.src = url;
                    img.onload = () => {
                        setTimeout(() => URL.revokeObjectURL(url), 3000);
                    };
                    div.appendChild(img);
                    photoCount++;
                } else if (isVideo) {
                    div.innerHTML = `<div class="video-icon">🎬</div>`;
                    videoCount++;
                }

                // Badge
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.textContent = ext;
                div.appendChild(badge);

                grid.appendChild(div);
            });

            // Update status
            const parts = [];
            if (photoCount) parts.push(`${photoCount} photos`);
            if (videoCount) parts.push(`${videoCount} videos`);
            status.textContent = `📁 ${folderName} • ${parts.join(' • ')}`;

            showToast(`✅ ${validFiles.length} items loaded`);
        });

        // Toast
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
