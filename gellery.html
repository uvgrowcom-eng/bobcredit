<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Folder Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .breadcrumb::-webkit-scrollbar { display: none; }

        .breadcrumb-item {
            color: #8e8e93;
            cursor: pointer;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            font-family: inherit;
            background: transparent;
            border: none;
            font-size: 12px;
        }

        .breadcrumb-item:hover {
            background: #1c1c1e;
            color: #fff;
        }

        .breadcrumb-item.current {
            color: #fff;
            font-weight: 600;
        }

        .breadcrumb-sep {
            color: #5f6368;
            font-size: 10px;
        }

        /* Header top */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .current-folder {
            flex: 1;
            min-width: 0;
        }

        .current-folder h1 {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-folder .stats {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .header-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            background: #1c1c1e;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .header-btn.primary {
            background: linear-gradient(45deg, #f09433, #dc2743);
        }

        .header-btn:active { transform: scale(0.95); }

        /* Search */
        .search-wrap {
            position: relative;
            margin-top: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }

        .search-input:focus { border-color: #1a73e8; }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
            font-size: 14px;
            pointer-events: none;
        }

        /* ===== FILE LIST (Vertical) ===== */
        .file-container {
            padding: 8px 0;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .list-item:active {
            background: #1c1c1e;
        }

        .list-thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            position: relative;
        }

        .list-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .list-thumb.folder {
            background: linear-gradient(135deg, #f09433, #dc2743);
            font-size: 24px;
        }

        .list-info {
            flex: 1;
            min-width: 0;
        }

        .list-name {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-meta {
            font-size: 12px;
            color: #8e8e93;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .list-meta .dot { opacity: 0.5; }

        .list-meta .item-count {
            background: #1c1c1e;
            padding: 1px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #8e8e93;
        }

        .list-arrow {
            color: #5f6368;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(26, 115, 232, 0.15);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: #8e8e93;
            font-size: 14px;
        }

        /* ===== EMPTY ===== */
        .empty {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* ===== OPEN SCREEN ===== */
        .open-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .open-screen-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .open-screen h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .open-screen p {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.6;
            max-width: 320px;
            margin-bottom: 30px;
        }

        .open-btn {
            padding: 18px 40px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.4);
            animation: gradientMove 4s ease infinite;
            font-family: inherit;
        }

        .open-btn:active { transform: scale(0.97); }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== PREVIEW MODAL ===== */
        #previewModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #previewModal.show { display: flex; }

        .preview-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .preview-content img,
        .preview-content video {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            display: block;
        }

        .preview-close {
            position: absolute;
            top: -44px;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 9999;
            animation: toastIn 0.3s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .hidden-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- OPEN SCREEN -->
    <div class="open-screen" id="openScreen">
        <div class="open-screen-icon">📁</div>
        <h1>Folder Explorer</h1>
        <p>Apna folder select karo — photos, videos, documents, sab kuch dikhega</p>
        <input type="file" id="folderInput" webkitdirectory multiple class="hidden-input">
        <button class="open-btn" id="openBtn">
            📁 Select Folder
        </button>
    </div>

    <!-- EXPLORER SCREEN -->
    <div id="explorerScreen" style="display:none;">
        <div class="header">
            <!-- Breadcrumb -->
            <div class="breadcrumb" id="breadcrumb"></div>

            <div class="header-top">
                <div class="current-folder">
                    <h1 id="currentFolderName">📁 Folder</h1>
                    <div class="stats" id="currentStats">0 items</div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" id="backBtn" style="display:none;">← Back</button>
                    <button class="header-btn primary" id="changeBtn">Change</button>
                </div>
            </div>

            <!-- Search -->
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="Search in this folder...">
            </div>
        </div>

        <!-- File Container -->
        <div class="file-container" id="fileContainer">
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">Loading...</div>
            </div>
        </div>
    </div>

    <!-- PREVIEW MODAL -->
    <div id="previewModal">
        <div class="preview-content">
            <button class="preview-close" id="previewClose">✕</button>
            <img id="previewImg" src="" alt="Preview" style="display:none;">
            <video id="previewVideo" controls style="display:none;"></video>
        </div>
    </div>

    <script>
        /* ============================================================
           STATE
           ============================================================ */
        let rootFiles = [];           // All files from initial folder
        let currentPath = [];         // ['Pictures', 'Camera']
        let currentItems = [];        // Items in current view
        let searchQuery = '';

        /* ============================================================
           FILE TYPE DETECTION
           ============================================================ */
        const FILE_TYPES = {
            image: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'bmp', 'svg', 'ico', 'tiff'],
            video: ['mp4', 'mov', 'avi', 'mkv', 'webm', 'flv', 'm4v', '3gp'],
            audio: ['mp3', 'wav', 'm4a', 'aac', 'ogg', 'flac', 'opus'],
            document: ['pdf', 'doc', 'docx', 'txt', 'xls', 'xlsx', 'ppt', 'pptx', 'csv', 'md', 'rtf', 'odt']
        };

        function getFileCategory(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            for (const [category, extensions] of Object.entries(FILE_TYPES)) {
                if (extensions.includes(ext)) return category;
            }
            return 'other';
        }

        function getFileIcon(category, ext) {
            const extIcons = {
                'pdf': '📕', 'doc': '📘', 'docx': '📘', 'txt': '📃',
                'xls': '📗', 'xlsx': '📗', 'ppt': '📙', 'pptx': '📙',
                'csv': '📊', 'md': '📝',
                'zip': '🗜️', 'rar': '🗜️', '7z': '🗜️',
                'apk': '📱', 'exe': '⚙️',
                'html': '🌐', 'css': '🎨', 'js': '⚡', 'json': '📋'
            };
            const catIcons = {
                video: '🎬', audio: '🎵', document: '📄', other: '📎', image: '🖼️'
            };
            return extIcons[ext] || catIcons[category] || '📎';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const day = 24 * 60 * 60 * 1000;
            if (diff < day) return 'Today';
            if (diff < 2 * day) return 'Yesterday';
            if (diff < 7 * day) return Math.floor(diff / day) + 'd ago';
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        /* ============================================================
           DOM REFS
           ============================================================ */
        const openScreen = document.getElementById('openScreen');
        const explorerScreen = document.getElementById('explorerScreen');
        const openBtn = document.getElementById('openBtn');
        const folderInput = document.getElementById('folderInput');
        const changeBtn = document.getElementById('changeBtn');
        const backBtn = document.getElementById('backBtn');
        const breadcrumb = document.getElementById('breadcrumb');
        const currentFolderName = document.getElementById('currentFolderName');
        const currentStats = document.getElementById('currentStats');
        const searchInput = document.getElementById('searchInput');
        const fileContainer = document.getElementById('fileContainer');
        const previewModal = document.getElementById('previewModal');
        const previewImg = document.getElementById('previewImg');
        const previewVideo = document.getElementById('previewVideo');
        const previewClose = document.getElementById('previewClose');

        /* ============================================================
           OPEN FOLDER
           ============================================================ */
        openBtn.addEventListener('click', () => folderInput.click());

        changeBtn.addEventListener('click', () => {
            folderInput.value = '';
            folderInput.click();
        });

        folderInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Reset
            rootFiles = [];
            currentPath = [];
            searchQuery = '';
            searchInput.value = '';

            // Show loading
            openScreen.style.display = 'none';
            explorerScreen.style.display = 'block';
            fileContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Processing ${files.length} files...</div>
                </div>
            `;

            // Process files — build tree structure
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const relativePath = file.webkitRelativePath || '';
                const parts = relativePath.split('/').filter(Boolean);

                // First part = root folder name
                const rootFolderName = parts[0];
                // Rest = path within
                const innerPath = parts.slice(1);

                rootFiles.push({
                    file,
                    name: file.name,
                    pathParts: innerPath,           // ['Camera', 'photo1.jpg']
                    rootFolder: rootFolderName,
                    size: file.size,
                    type: file.type,
                    category: getFileCategory(file.name),
                    ext: file.name.split('.').pop().toLowerCase(),
                    lastModified: file.lastModified,
                    isFile: true
                });

                // Yield every 100
                if (i % 100 === 0) await new Promise(r => setTimeout(r, 0));
            }

            console.log(`✅ Loaded ${rootFiles.length} files`);
            console.log(`📁 Root folder: ${rootFiles[0]?.rootFolder}`);

            // Navigate to root
            navigateTo([]);
        });

        /* ============================================================
           NAVIGATE
           ============================================================ */
        function navigateTo(pathArray) {
            currentPath = pathArray;
            searchQuery = '';
            searchInput.value = '';
            renderCurrentFolder();
        }

        function renderCurrentFolder() {
            // Filter files matching current path
            const matchingFiles = rootFiles.filter(f => {
                // Check if file's path starts with currentPath
                if (f.pathParts.length < currentPath.length + 1) return false;
                for (let i = 0; i < currentPath.length; i++) {
                    if (f.pathParts[i] !== currentPath[i]) return false;
                }
                return true;
            });

            // Group by next segment
            const folders = new Map();  // name -> { files: [], subfolders: Set }
            const files = [];

            matchingFiles.forEach(f => {
                const remainingPath = f.pathParts.slice(currentPath.length);

                if (remainingPath.length === 1) {
                    // File is directly in current folder
                    files.push(f);
                } else if (remainingPath.length > 1) {
                    // File is in sub-folder
                    const subfolderName = remainingPath[0];
                    if (!folders.has(subfolderName)) {
                        folders.set(subfolderName, { name: subfolderName, count: 0, files: [] });
                    }
                    folders.get(subfolderName).count++;
                }
            });

            // Build items list
            const items = [];

            // Add folders first
            folders.forEach((folder, name) => {
                items.push({
                    type: 'folder',
                    name: name,
                    count: folder.count,
                    path: [...currentPath, name]
                });
            });

            // Add files
            files.forEach(f => {
                items.push({
                    type: 'file',
                    ...f
                });
            });

            currentItems = items;

            // Render
            renderHeader();
            renderItems();
        }

        /* ============================================================
           RENDER HEADER
           ============================================================ */
        function renderHeader() {
            const rootName = rootFiles[0]?.rootFolder || 'Folder';
            const fullPath = [rootName, ...currentPath];

            // Folder name
            const displayName = currentPath.length > 0
                ? currentPath[currentPath.length - 1]
                : rootName;

            currentFolderName.textContent = '📁 ' + displayName;

            // Stats
            const folderCount = currentItems.filter(i => i.type === 'folder').length;
            const fileCount = currentItems.filter(i => i.type === 'file').length;
            const parts = [];
            if (folderCount) parts.push(`${folderCount} folders`);
            if (fileCount) parts.push(`${fileCount} files`);
            currentStats.textContent = parts.join(' • ') || 'Empty';

            // Breadcrumb
            breadcrumb.innerHTML = '';
            fullPath.forEach((part, index) => {
                if (index > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'breadcrumb-sep';
                    sep.textContent = '›';
                    breadcrumb.appendChild(sep);
                }

                const btn = document.createElement('button');
                btn.className = 'breadcrumb-item';
                if (index === fullPath.length - 1) btn.classList.add('current');
                btn.textContent = index === 0 ? '🏠 ' + part : part;

                // Click handler
                const targetPath = fullPath.slice(1, index + 1);  // remove root
                btn.addEventListener('click', () => navigateTo(targetPath));

                breadcrumb.appendChild(btn);
            });

            // Back button
            if (currentPath.length > 0) {
                backBtn.style.display = 'block';
                backBtn.onclick = () => {
                    const parentPath = currentPath.slice(0, -1);
                    navigateTo(parentPath);
                };
            } else {
                backBtn.style.display = 'none';
            }
        }

        /* ============================================================
           RENDER ITEMS
           ============================================================ */
        function renderItems() {
            // Apply search filter
            let items = currentItems;
            if (searchQuery) {
                items = items.filter(i => i.name.toLowerCase().includes(searchQuery));
            }

            if (items.length === 0) {
                fileContainer.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">${searchQuery ? '🔍' : '📭'}</div>
                        <div class="empty-title">${searchQuery ? 'Koi result nahi' : 'Folder khaali hai'}</div>
                        <div class="empty-sub">${searchQuery ? 'Try different search' : 'Is folder mein kuch nahi hai'}</div>
                    </div>
                `;
                return;
            }

            fileContainer.innerHTML = '';

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.style.animationDelay = `${Math.min(index * 0.02, 0.3)}s`;

                // Thumb
                const thumb = document.createElement('div');
                thumb.className = 'list-thumb';

                if (item.type === 'folder') {
                    thumb.classList.add('folder');
                    thumb.textContent = '📁';
                } else if (item.category === 'image') {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = URL.createObjectURL(item.file);
                    img.onload = function() { URL.revokeObjectURL(this.src); };
                    thumb.appendChild(img);
                } else {
                    thumb.textContent = getFileIcon(item.category, item.ext);
                }

                // Info
                const info = document.createElement('div');
                info.className = 'list-info';

                if (item.type === 'folder') {
                    info.innerHTML = `
                        <div class="list-name">${escapeHtml(item.name)}</div>
                        <div class="list-meta">
                            <span class="item-count">${item.count} items</span>
                        </div>
                    `;
                } else {
                    info.innerHTML = `
                        <div class="list-name">${escapeHtml(item.name)}</div>
                        <div class="list-meta">
                            <span>${formatBytes(item.size)}</span>
                            <span class="dot">•</span>
                            <span>${formatDate(item.lastModified)}</span>
                        </div>
                    `;
                }

                // Arrow (for folders)
                let arrow = null;
                if (item.type === 'folder') {
                    arrow = document.createElement('div');
                    arrow.className = 'list-arrow';
                    arrow.textContent = '›';
                }

                div.appendChild(thumb);
                div.appendChild(info);
                if (arrow) div.appendChild(arrow);

                // Click handler
                div.addEventListener('click', () => {
                    if (item.type === 'folder') {
                        navigateTo(item.path);
                    } else {
                        handleFileClick(item);
                    }
                });

                fileContainer.appendChild(div);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* ============================================================
           FILE CLICK — PREVIEW
           ============================================================ */
        function handleFileClick(item) {
            if (item.category === 'image') {
                previewImg.src = URL.createObjectURL(item.file);
                previewImg.style.display = 'block';
                previewVideo.style.display = 'none';
                previewVideo.src = '';
                previewModal.classList.add('show');
            } else if (item.category === 'video') {
                previewVideo.src = URL.createObjectURL(item.file);
                previewVideo.style.display = 'block';
                previewImg.style.display = 'none';
                previewImg.src = '';
                previewModal.classList.add('show');
            } else {
                showToast(`📄 ${item.name} • ${formatBytes(item.size)}`);
            }
        }

        previewClose.addEventListener('click', closePreview);
        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) closePreview();
        });

        function closePreview() {
            previewModal.classList.remove('show');
            if (previewImg.src) {
                URL.revokeObjectURL(previewImg.src);
                previewImg.src = '';
            }
            if (previewVideo.src) {
                URL.revokeObjectURL(previewVideo.src);
                previewVideo.src = '';
                previewVideo.pause();
            }
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = searchInput.value.trim().toLowerCase();
                renderItems();
            }, 200);
        });

        /* ============================================================
           TOAST
           ============================================================ */
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* ============================================================
           INIT
           ============================================================ */
        console.log('✅ Folder Explorer ready');
    </script>
</body>
</html>
