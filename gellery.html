<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Folder Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 0 0 40px;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 20px 16px 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #8e8e93;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            max-width: 500px;
            margin: 0 auto 16px;
            padding: 12px 16px;
            background: #1c1c1e;
            border-radius: 12px;
            font-size: 13px;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-bar.success {
            background: rgba(52, 168, 83, 0.12);
            border: 1px solid rgba(52, 168, 83, 0.3);
            color: #34A853;
        }

        .status-bar.error {
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #FF3B30;
        }

        .status-bar.warning {
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #FFC107;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .status-folder {
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            background: #2c2c2e;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .status-btn.primary {
            background: linear-gradient(45deg, #f09433, #dc2743);
        }

        /* ===== MAIN BUTTON ===== */
        .open-btn-wrap {
            max-width: 500px;
            margin: 0 auto 20px;
            padding: 0 16px;
        }

        .open-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.4);
            animation: gradientMove 4s ease infinite;
            transition: transform 0.15s;
        }

        .open-btn:active {
            transform: scale(0.97);
        }

        .open-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== FILE GRID ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 0 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .file-item {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .file-item:active {
            transform: scale(0.95);
        }

        .file-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-item .file-icon {
            font-size: 32px;
            opacity: 0.7;
        }

        .file-item .file-ext {
            position: absolute;
            bottom: 6px;
            left: 6px;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-item.folder .file-icon {
            font-size: 40px;
            opacity: 1;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(220, 39, 67, 0.15);
            border-top-color: #dc2743;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #8e8e93;
            font-size: 14px;
        }

        /* ===== EMPTY ===== */
        .empty {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 9999;
            animation: toastIn 0.3s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Info box */
        .info-box {
            max-width: 500px;
            margin: 16px auto;
            padding: 14px 16px;
            background: rgba(26, 115, 232, 0.08);
            border: 1px solid rgba(26, 115, 232, 0.25);
            border-radius: 12px;
            font-size: 12px;
            color: #6BA3E8;
            line-height: 1.6;
            display: flex;
            gap: 10px;
        }

        .info-box strong {
            color: #1a73e8;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>📁 Folder Browser</h1>
        <p>Ek baar folder select karo — saari files dikhengi</p>
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar" id="statusBar">
        <div class="status-info">
            <span id="statusIcon">📂</span>
            <span id="statusText">Koi folder select nahi kiya</span>
        </div>
        <button class="status-btn" id="changeFolderBtn" style="display:none;">
            Change
        </button>
    </div>

    <!-- OPEN BUTTON -->
    <div class="open-btn-wrap" id="openBtnWrap">
        <button class="open-btn" id="openFolderBtn">
            📂 Open Folder
        </button>
    </div>

    <!-- INFO BOX -->
    <div class="info-box" id="infoBox">
        <span>💡</span>
        <span>
            <strong>Tip:</strong> Jab folder select karo, Chrome "Allow" button dikhayega. 
            Us par click karo taaki files load ho sakein.
        </span>
    </div>

    <!-- FILE GRID -->
    <div class="file-grid" id="fileGrid">
        <div class="empty">
            <div class="empty-icon">📁</div>
            <div class="empty-title">Folder select karo</div>
            <div class="empty-sub">Open Folder button dabao aur apni gallery ka folder choose karo</div>
        </div>
    </div>

    <script>
        /* ============================================================
           INDEXEDDB — dirHandle save karne ke liye
           ============================================================ */
        const DB_NAME = 'folder_browser_db';
        const DB_VERSION = 1;
        const STORE_NAME = 'handles';
        const HANDLE_KEY = 'saved_folder';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveHandle(key, handle) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(handle, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getHandle(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteHandle(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        /* ============================================================
           DOM REFS
           ============================================================ */
        const statusBar = document.getElementById('statusBar');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const changeFolderBtn = document.getElementById('changeFolderBtn');
        const openBtnWrap = document.getElementById('openBtnWrap');
        const openFolderBtn = document.getElementById('openFolderBtn');
        const fileGrid = document.getElementById('fileGrid');
        const infoBox = document.getElementById('infoBox');

        /* ============================================================
           CHECK SUPPORT
           ============================================================ */
        const isSupported = 'showDirectoryPicker' in window;

        if (!isSupported) {
            openFolderBtn.disabled = true;
            openFolderBtn.textContent = '❌ Not Supported';

            statusBar.classList.add('error');
            statusIcon.textContent = '⚠️';
            statusText.textContent = 'Chrome 86+ chahiye';

            infoBox.innerHTML = `
                <span>❌</span>
                <span>
                    Ye browser <strong>File System Access API</strong> support nahi karta. 
                    Chrome ya Edge use karo.
                </span>
            `;
        }

        /* ============================================================
           HELPERS
           ============================================================ */
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function getFileIcon(ext) {
            const icons = {
                'pdf': '📕', 'doc': '📘', 'docx': '📘', 'txt': '📃',
                'xls': '📗', 'xlsx': '📗', 'ppt': '📙', 'pptx': '📙',
                'mp4': '🎬', 'mov': '🎬', 'avi': '🎬', 'mkv': '🎬',
                'mp3': '🎵', 'wav': '🎵', 'm4a': '🎵',
                'zip': '🗜️', 'rar': '🗜️', '7z': '🗜️',
                'apk': '📱', 'exe': '⚙️', 'html': '🌐'
            };
            return icons[ext] || '📎';
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function setStatus(type, icon, text) {
            statusBar.className = 'status-bar';
            if (type) statusBar.classList.add(type);
            statusIcon.textContent = icon;
            statusText.textContent = text;
        }

        /* ============================================================
           OPEN FOLDER — MAIN LOGIC
           ============================================================ */
        openFolderBtn.addEventListener('click', async () => {
            if (!isSupported) return;

            try {
                setStatus('', '⏳', 'Permission maang raha hai...');

                // 🔥 YAHAN "Allow" dialog aata hai
                const dirHandle = await window.showDirectoryPicker({
                    mode: 'read',
                    startIn: 'pictures'
                });

                // Save karo — next time yaad rahe
                await saveHandle(HANDLE_KEY, dirHandle);

                // Load files
                await loadFolder(dirHandle);

            } catch (err) {
                if (err.name === 'AbortError') {
                    setStatus('', '📂', 'Koi folder select nahi kiya');
                    return;
                }
                console.error('❌ Error:', err);
                setStatus('error', '❌', 'Error: ' + err.message);
            }
        });

        /* ============================================================
           LOAD FOLDER — saari files dikhao
           ============================================================ */
        async function loadFolder(dirHandle) {
            setStatus('', '⏳', `Loading from: ${dirHandle.name}...`);
            fileGrid.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Files load ho rahi hain...</div>
                </div>
            `;

            try {
                // Permission verify karo
                const perm = await dirHandle.queryPermission({ mode: 'read' });
                if (perm !== 'granted') {
                    const req = await dirHandle.requestPermission({ mode: 'read' });
                    if (req !== 'granted') {
                        setStatus('error', '🔒', 'Permission denied');
                        fileGrid.innerHTML = `
                            <div class="empty">
                                <div class="empty-icon">🔒</div>
                                <div class="empty-title">Permission denied</div>
                                <div class="empty-sub">Folder access ke liye Allow karo</div>
                            </div>
                        `;
                        return;
                    }
                }

                // Saari entries collect karo
                const entries = [];
                for await (const entry of dirHandle.values()) {
                    entries.push(entry);
                }

                // Sort — folders pehle, phir files
                entries.sort((a, b) => {
                    if (a.kind === 'directory' && b.kind !== 'directory') return -1;
                    if (a.kind !== 'directory' && b.kind === 'directory') return 1;
                    return a.name.localeCompare(b.name);
                });

                fileGrid.innerHTML = '';

                if (entries.length === 0) {
                    fileGrid.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">Folder khaali hai</div>
                            <div class="empty-sub">Is folder mein koi file nahi hai</div>
                        </div>
                    `;
                    setStatus('warning', '📭', `${dirHandle.name} khaali hai`);
                    return;
                }

                let photoCount = 0;
                let fileCount = 0;
                let folderCount = 0;

                for (const entry of entries) {
                    if (entry.kind === 'directory') {
                        addFolderItem(entry);
                        folderCount++;
                    } else {
                        const isImage = /\.(jpg|jpeg|png|gif|webp|heic|bmp|svg)$/i.test(entry.name);

                        if (isImage) {
                            try {
                                const file = await entry.getFile();
                                const url = URL.createObjectURL(file);
                                addPhotoItem(url, entry.name, file.size);
                                photoCount++;
                            } catch (e) {
                                console.warn('Skip:', entry.name, e);
                            }
                        } else {
                            try {
                                const file = await entry.getFile();
                                addFileItem(entry.name, file.size, file.lastModified);
                                fileCount++;
                            } catch (e) {
                                console.warn('Skip:', entry.name, e);
                            }
                        }
                    }

                    // UI yield — performance
                    if ((photoCount + fileCount + folderCount) % 20 === 0) {
                        await new Promise(r => setTimeout(r, 1));
                    }
                }

                // Success
                const summary = [];
                if (photoCount > 0) summary.push(`${photoCount} photos`);
                if (fileCount > 0) summary.push(`${fileCount} files`);
                if (folderCount > 0) summary.push(`${folderCount} folders`);

                setStatus('success', '✅', `${dirHandle.name} • ${summary.join(' • ')}`);

                // UI updates
                openBtnWrap.style.display = 'none';
                changeFolderBtn.style.display = 'block';
                infoBox.style.display = 'none';

            } catch (err) {
                console.error('Load error:', err);
                setStatus('error', '❌', 'Error: ' + err.message);
            }
        }

        /* ============================================================
           RENDER ITEMS
           ============================================================ */
        function addPhotoItem(url, name, size) {
            const div = document.createElement('div');
            div.className = 'file-item';
            
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = url;
            img.onload = () => URL.revokeObjectURL(url);
            div.appendChild(img);

            const ext = name.split('.').pop().toUpperCase();
            const extBadge = document.createElement('div');
            extBadge.className = 'file-ext';
            extBadge.textContent = ext;
            div.appendChild(extBadge);

            div.addEventListener('click', () => {
                showToast(`${name} • ${formatBytes(size)}`);
            });

            fileGrid.appendChild(div);
        }

        function addFileItem(name, size, mtime) {
            const div = document.createElement('div');
            div.className = 'file-item';

            const ext = name.split('.').pop().toLowerCase();
            const icon = document.createElement('div');
            icon.className = 'file-icon';
            icon.textContent = getFileIcon(ext);
            div.appendChild(icon);

            const extBadge = document.createElement('div');
            extBadge.className = 'file-ext';
            extBadge.textContent = ext.toUpperCase();
            div.appendChild(extBadge);

            div.addEventListener('click', () => {
                showToast(`${name} • ${formatBytes(size)}`);
            });

            fileGrid.appendChild(div);
        }

        function addFolderItem(entry) {
            const div = document.createElement('div');
            div.className = 'file-item folder';

            const icon = document.createElement('div');
            icon.className = 'file-icon';
            icon.textContent = '📁';
            div.appendChild(icon);

            const extBadge = document.createElement('div');
            extBadge.className = 'file-ext';
            extBadge.textContent = 'DIR';
            div.appendChild(extBadge);

            div.addEventListener('click', async () => {
                // Sub-folder mein jao
                await loadFolder(entry);
            });

            fileGrid.appendChild(div);
        }

        /* ============================================================
           CHANGE FOLDER
           ============================================================ */
        changeFolderBtn.addEventListener('click', async () => {
            await deleteHandle(HANDLE_KEY);
            openBtnWrap.style.display = 'block';
            changeFolderBtn.style.display = 'none';
            infoBox.style.display = 'flex';
            fileGrid.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📁</div>
                    <div class="empty-title">Folder select karo</div>
                    <div class="empty-sub">Open Folder button dabao</div>
                </div>
            `;
            setStatus('', '📂', 'Koi folder select nahi kiya');
        });

        /* ============================================================
           INIT — Saved folder check karo
           ============================================================ */
        async function init() {
            if (!isSupported) return;

            try {
                const savedHandle = await getHandle(HANDLE_KEY);
                if (!savedHandle) return;

                const perm = await savedHandle.queryPermission({ mode: 'read' });

                if (perm === 'granted') {
                    // ✅ Silent load
                    console.log('✅ Auto-loading saved folder');
                    await loadFolder(savedHandle);
                } else if (perm === 'prompt') {
                    // ⚠️ Reconnect banner
                    setStatus('warning', '⚠️', `${savedHandle.name} • Reconnect karo`);
                    changeFolderBtn.textContent = 'Reconnect';
                    changeFolderBtn.style.display = 'block';
                    openBtnWrap.style.display = 'none';

                    changeFolderBtn.onclick = async () => {
                        try {
                            const req = await savedHandle.requestPermission({ mode: 'read' });
                            if (req === 'granted') {
                                await loadFolder(savedHandle);
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    };
                }
            } catch (err) {
                console.warn('Init error:', err);
            }
        }

        init();
    </script>
</body>
</html>
