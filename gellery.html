<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding: 20px; min-height: 100vh; }

        .open-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #1c1c1e;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hidden { display: none; }

        .info {
            text-align: center;
            padding: 20px;
            color: #8e8e93;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <input type="file" id="folderInput" webkitdirectory multiple class="hidden">
    
    <button class="open-btn" id="openBtn">
        📁 Open Gallery
    </button>

    <div class="info" id="info">Koi folder select nahi kiya</div>
    
    <div class="grid" id="grid"></div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const openBtn = document.getElementById('openBtn');
        const grid = document.getElementById('grid');
        const info = document.getElementById('info');

        openBtn.addEventListener('click', () => {
            folderInput.click();  // 🔥 Seedha system picker khulega — NO WARNING
        });

        folderInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            if (files.length === 0) return;

            // Get folder name
            const folderName = files[0].webkitRelativePath.split('/')[0];
            info.textContent = `📁 ${folderName} • ${files.length} files`;

            // Filter images
            const images = files.filter(f => f.type.startsWith('image/'));

            // Show in grid
            grid.innerHTML = '';
            images.forEach(file => {
                const url = URL.createObjectURL(file);
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<img src="${url}" loading="lazy">`;
                grid.appendChild(div);
            });

            info.textContent = `📁 ${folderName} • ${images.length} photos`;
        });
    </script>
</body>
</html>
