<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Folder Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding: 20px; min-height: 100vh; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; margin-bottom: 8px; }
        .header p { font-size: 13px; color: #8e8e93; }

        .gallery-btn {
            width: 100%; max-width: 400px; margin: 0 auto 20px; display: block;
            padding: 18px; border: none; border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.5);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .gallery-btn:active { transform: scale(0.97); }

        .status { text-align: center; font-size: 13px; color: #8e8e93; margin-bottom: 20px; min-height: 20px; }

        .file-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 4px; max-width: 500px; margin: 0 auto;
        }

        .file-item {
            aspect-ratio: 1; border-radius: 8px; overflow: hidden;
            cursor: pointer; position: relative; background: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
        }
        .file-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .file-item .file-icon { font-size: 32px; opacity: 0.6; }
        .file-item .file-name {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 6px 8px; font-size: 10px; color: #fff;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-item.selected { outline: 3px solid #dc2743; outline-offset: -3px; }

        .empty { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #8e8e93; font-size: 14px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        .loading { grid-column: 1 / -1; text-align: center; padding: 40px 20px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(220, 39, 67, 0.2);
            border-top-color: #dc2743; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .info-box {
            max-width: 500px; margin: 20px auto; padding: 16px;
            background: rgba(26, 115, 232, 0.1); border: 1px solid rgba(26, 115, 232, 0.3);
            border-radius: 12px; font-size: 13px; color: #8e8e93; line-height: 1.6;
        }
        .info-box strong { color: #1a73e8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📁 Folder Browser</h1>
        <p>Apna folder select karo — saari files dikhengi</p>
    </div>

    <button class="gallery-btn" id="openFolderBtn">
        📂 Open Folder
    </button>

    <div class="status" id="status"></div>

    <div class="file-grid" id="fileGrid">
        <div class="empty">
            <div class="empty-icon">📁</div>
            <div>Folder select karne ke liye button dabao</div>
        </div>
    </div>

    <div class="info-box" id="infoBox" style="display:none;">
        <strong>💡 Tip:</strong> Android pe <strong>Pictures</strong>, <strong>DCIM</strong>, ya <strong>Documents</strong> folder select karo. Root folder select nahi hota.
    </div>

    <script>
        const openFolderBtn = document.getElementById('openFolderBtn');
        const fileGrid = document.getElementById('fileGrid');
        const status = document.getElementById('status');
        const infoBox = document.getElementById('infoBox');

        // Check support
        const isSupported = 'showDirectoryPicker' in window;

        if (!isSupported) {
            openFolderBtn.disabled = true;
            openFolderBtn.style.opacity = '0.5';
            openFolderBtn.textContent = '❌ Not Supported';
            status.textContent = 'Chrome (Android/Desktop) version 132+ chahiye';
            infoBox.style.display = 'block';
        } else {
            infoBox.style.display = 'block';
        }

        openFolderBtn.addEventListener('click', async () => {
            if (!isSupported) return;

            try {
                status.textContent = '📂 Permission maang raha hai...';

                // Folder picker kholo — READ mode
                const dirHandle = await window.showDirectoryPicker({
                    mode: 'read',
                    startIn: 'pictures'  // Pictures se start karo
                });

                console.log('📁 Folder opened:', dirHandle.name);
                status.textContent = `📂 Loading from: ${dirHandle.name}`;

                // Saari files load karo
                await loadAllFiles(dirHandle);

            } catch (err) {
                if (err.name === 'AbortError') {
                    status.textContent = 'Cancelled';
                    return;
                }
                console.error('❌ Error:', err);
                status.textContent = '❌ Error: ' + err.message;

                if (err.message.includes('permission') || err.message.includes('denied')) {
                    alert('Permission denied. Settings mein location/file access allow karo.');
                }
            }
        });

        async function loadAllFiles(dirHandle) {
            fileGrid.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading files...</div></div>';

            const files = [];

            // Saari entries collect karo
            for await (const entry of dirHandle.values()) {
                files.push(entry);
            }

            // Folders pehle, phir files (alphabetically)
            files.sort((a, b) => {
                if (a.kind === 'directory' && b.kind !== 'directory') return -1;
                if (a.kind !== 'directory' && b.kind === 'directory') return 1;
                return a.name.localeCompare(b.name);
            });

            fileGrid.innerHTML = '';

            if (files.length === 0) {
                fileGrid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>Folder khaali hai</div></div>';
                return;
            }

            let photoCount = 0;
            let fileCount = 0;
            let folderCount = 0;

            // Ek ek karke render karo
            for (const entry of files) {
                if (entry.kind === 'directory') {
                    addFolderToGrid(entry);
                    folderCount++;
                } else {
                    // File hai — check karo image hai ya nahi
                    const isImage = /\.(jpg|jpeg|png|gif|webp|heic|bmp)$/i.test(entry.name);
                    
                    if (isImage) {
                        try {
                            const file = await entry.getFile();
                            const url = URL.createObjectURL(file);
                            addPhotoToGrid(url, entry.name);
                            photoCount++;
                        } catch (e) {
                            console.warn('Skip:', entry.name, e);
                        }
                    } else {
                        addFileToGrid(entry.name);
                        fileCount++;
                    }
                }

                // UI update har 20 files ke baad
                if ((photoCount + fileCount + folderCount) % 20 === 0) {
                    await new Promise(r => setTimeout(r, 1));
                }
            }

            status.textContent = `✅ ${photoCount} photos • ${fileCount} files • ${folderCount} folders`;
        }

        function addPhotoToGrid(url, name) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<img src="${url}" alt="${name}" loading="lazy">`;
            div.addEventListener('click', () => {
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                console.log('✅ Selected:', name);
            });
            fileGrid.appendChild(div);
        }

        function addFileToGrid(name) {
            const div = document.createElement('div');
            div.className = 'file-item';
            const ext = name.split('.').pop().toLowerCase();
            const icon = getFileIcon(ext);
            div.innerHTML = `<div class="file-icon">${icon}</div><div class="file-name">${name}</div>`;
            div.addEventListener('click', () => {
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                console.log('✅ Selected:', name);
            });
            fileGrid.appendChild(div);
        }

        function addFolderToGrid(entry) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<div class="file-icon">📁</div><div class="file-name">${entry.name}</div>`;
            div.addEventListener('click', async () => {
                // Folder ke andar jao
                status.textContent = `📂 Entering: ${entry.name}`;
                await loadAllFiles(entry);
            });
            fileGrid.appendChild(div);
        }

        function getFileIcon(ext) {
            const icons = {
                'pdf': '📄', 'doc': '📝', 'docx': '📝', 'txt': '📃',
                'mp4': '🎬', 'mov': '🎬', 'avi': '🎬', 'mkv': '🎬',
                'mp3': '🎵', 'wav': '🎵', 'm4a': '🎵',
                'zip': '📦', 'rar': '📦', '7z': '📦',
                'apk': '📱', 'exe': '⚙️'
            };
            return icons[ext] || '📎';
        }
    </script>
</body>
</html>
