<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Folder Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 16px;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .folder-info {
            flex: 1;
            min-width: 0;
        }

        .folder-info h1 {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-info .sub {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .change-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 10px;
            background: #1c1c1e;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        /* Search */
        .search-wrap {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        .search-input:focus {
            border-color: #1a73e8;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
            font-size: 16px;
            pointer-events: none;
        }

        /* Filter chips */
        .chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0;
            padding: 7px 12px;
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            color: #8e8e93;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
        }

        .chip.active {
            background: linear-gradient(45deg, #f09433, #dc2743);
            border-color: transparent;
            color: #fff;
        }

        .chip-count {
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
        }

        /* ===== OPEN BUTTON ===== */
        .open-wrap {
            max-width: 500px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .open-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.4);
            animation: gradientMove 4s ease infinite;
            font-family: inherit;
        }

        .open-btn:active { transform: scale(0.97); }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== FILE GRID ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .file-item {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .file-item:active { transform: scale(0.95); }

        .file-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-icon-big {
            font-size: 36px;
            opacity: 0.9;
        }

        .file-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-badge.right {
            left: auto;
            right: 6px;
        }

        .file-badge.folder-badge {
            background: linear-gradient(45deg, #f09433, #dc2743);
        }

        /* ===== LIST VIEW ===== */
        .file-list {
            padding: 0 12px;
            max-width: 600px;
            margin: 0 auto;
            display: none;
        }

        .file-list.show { display: block; }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .list-item:active { background: #1c1c1e; }

        .list-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .list-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .list-info {
            flex: 1;
            min-width: 0;
        }

        .list-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-meta {
            font-size: 12px;
            color: #8e8e93;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .list-meta .dot { opacity: 0.5; }

        /* ===== LOADING ===== */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(26, 115, 232, 0.15);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: #8e8e93;
            font-size: 14px;
        }

        .loading-progress {
            margin-top: 12px;
            font-size: 12px;
            color: #5f6368;
        }

        /* ===== EMPTY ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2e;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 9999;
            animation: toastIn 0.3s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== PREVIEW MODAL ===== */
        #previewModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #previewModal.show { display: flex; }

        .preview-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .preview-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            display: block;
        }

        .preview-close {
            position: absolute;
            top: -40px;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* Hidden input */
        .hidden-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header" id="header" style="display:none;">
        <div class="header-top">
            <div class="folder-info">
                <h1 id="folderName">📁 Folder</h1>
                <div class="sub" id="folderStats">Loading...</div>
            </div>
            <button class="change-btn" id="changeBtn">Change</button>
        </div>

        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Search files...">
        </div>

        <div class="chips" id="chips">
            <button class="chip active" data-filter="all">All <span class="chip-count" id="cntAll">0</span></button>
            <button class="chip" data-filter="image">🖼️ Photos <span class="chip-count" id="cntImg">0</span></button>
            <button class="chip" data-filter="video">🎬 Videos <span class="chip-count" id="cntVid">0</span></button>
            <button class="chip" data-filter="audio">🎵 Audio <span class="chip-count" id="cntAud">0</span></button>
            <button class="chip" data-filter="document">📄 Docs <span class="chip-count" id="cntDoc">0</span></button>
            <button class="chip" data-filter="other">📎 Other <span class="chip-count" id="cntOth">0</span></button>
        </div>
    </div>

    <!-- OPEN BUTTON -->
    <div class="open-wrap" id="openWrap">
        <input type="file" id="folderInput" webkitdirectory multiple class="hidden-input">
        <button class="open-btn" id="openBtn">
            📁 Select Folder
        </button>
    </div>

    <!-- FILE GRID -->
    <div class="file-grid" id="fileGrid">
        <div class="empty">
            <div class="empty-icon">📁</div>
            <div class="empty-title">Folder select karo</div>
            <div class="empty-sub">Saari files — photos, videos, documents — ek saath dikhengi</div>
        </div>
    </div>

    <!-- FILE LIST -->
    <div class="file-list" id="fileList"></div>

    <!-- PREVIEW MODAL -->
    <div id="previewModal">
        <div class="preview-content">
            <button class="preview-close" id="previewClose">✕</button>
            <img id="previewImg" src="" alt="Preview">
        </div>
    </div>

    <script>
        /* ============================================================
           STATE
           ============================================================ */
        let allFiles = [];       // All files from folder
        let filteredFiles = [];  // After filter + search
        let currentFilter = 'all';
        let searchQuery = '';

        /* ============================================================
           FILE TYPE DETECTION
           ============================================================ */
        const FILE_TYPES = {
            image: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'bmp', 'svg', 'ico', 'tiff'],
            video: ['mp4', 'mov', 'avi', 'mkv', 'webm', 'flv', 'm4v', '3gp'],
            audio: ['mp3', 'wav', 'm4a', 'aac', 'ogg', 'flac', 'opus'],
            document: ['pdf', 'doc', 'docx', 'txt', 'xls', 'xlsx', 'ppt', 'pptx', 'csv', 'md', 'rtf', 'odt']
        };

        function getFileCategory(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            for (const [category, extensions] of Object.entries(FILE_TYPES)) {
                if (extensions.includes(ext)) return category;
            }
            return 'other';
        }

        function getFileIcon(category, ext) {
            const extIcons = {
                'pdf': '📕', 'doc': '📘', 'docx': '📘', 'txt': '📃',
                'xls': '📗', 'xlsx': '📗', 'ppt': '📙', 'pptx': '📙',
                'csv': '📊', 'md': '📝', 'rtf': '📄', 'odt': '📄',
                'zip': '🗜️', 'rar': '🗜️', '7z': '🗜️', 'tar': '🗜️', 'gz': '🗜️',
                'apk': '📱', 'exe': '⚙️', 'dmg': '💿', 'iso': '💿',
                'html': '🌐', 'css': '🎨', 'js': '⚡', 'json': '📋',
                'xml': '📋', 'py': '🐍', 'java': '☕', 'cpp': '⚙️',
                'ttf': '🔤', 'otf': '🔤', 'woff': '🔤'
            };
            const catIcons = {
                video: '🎬', audio: '🎵', document: '📄', other: '📎', image: '🖼️'
            };
            return extIcons[ext] || catIcons[category] || '📎';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const day = 24 * 60 * 60 * 1000;
            if (diff < day) return 'Today';
            if (diff < 2 * day) return 'Yesterday';
            if (diff < 7 * day) return Math.floor(diff / day) + 'd ago';
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        /* ============================================================
           DOM REFS
           ============================================================ */
        const header = document.getElementById('header');
        const folderName = document.getElementById('folderName');
        const folderStats = document.getElementById('folderStats');
        const changeBtn = document.getElementById('changeBtn');
        const openWrap = document.getElementById('openWrap');
        const openBtn = document.getElementById('openBtn');
        const folderInput = document.getElementById('folderInput');
        const fileGrid = document.getElementById('fileGrid');
        const fileList = document.getElementById('fileList');
        const searchInput = document.getElementById('searchInput');
        const chips = document.getElementById('chips');
        const previewModal = document.getElementById('previewModal');
        const previewImg = document.getElementById('previewImg');
        const previewClose = document.getElementById('previewClose');

        /* ============================================================
           OPEN FOLDER
           ============================================================ */
        openBtn.addEventListener('click', () => folderInput.click());
        changeBtn.addEventListener('click', () => {
            folderInput.value = '';
            folderInput.click();
        });

        folderInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Get folder name
            const firstPath = files[0].webkitRelativePath || '';
            const folder = firstPath.split('/')[0] || 'Folder';

            // Show loading
            folderName.textContent = '📁 ' + folder;
            folderStats.textContent = 'Loading...';
            header.style.display = 'block';
            openWrap.style.display = 'none';

            fileGrid.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Processing files...</div>
                    <div class="loading-progress" id="loadProgress">0 / ${files.length}</div>
                </div>
            `;

            // Process files
            allFiles = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const category = getFileCategory(file.name);
                const ext = file.name.split('.').pop().toLowerCase();

                allFiles.push({
                    file,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    category,
                    ext,
                    lastModified: file.lastModified,
                    path: file.webkitRelativePath,
                    url: null  // lazy
                });

                // Update progress every 50 files
                if (i % 50 === 0) {
                    const progress = document.getElementById('loadProgress');
                    if (progress) progress.textContent = `${i} / ${files.length}`;
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            console.log(`✅ Loaded ${allFiles.length} files`);

            // Update counts
            updateCounts();

            // Render
            applyFilters();
        });

        /* ============================================================
           COUNTS
           ============================================================ */
        function updateCounts() {
            const counts = { all: allFiles.length, image: 0, video: 0, audio: 0, document: 0, other: 0 };
            allFiles.forEach(f => {
                if (counts[f.category] !== undefined) counts[f.category]++;
            });
            document.getElementById('cntAll').textContent = counts.all;
            document.getElementById('cntImg').textContent = counts.image;
            document.getElementById('cntVid').textContent = counts.video;
            document.getElementById('cntAud').textContent = counts.audio;
            document.getElementById('cntDoc').textContent = counts.document;
            document.getElementById('cntOth').textContent = counts.other;

            // Header stats
            const parts = [];
            if (counts.image) parts.push(`${counts.image} photos`);
            if (counts.video) parts.push(`${counts.video} videos`);
            if (counts.document) parts.push(`${counts.document} docs`);
            if (counts.audio) parts.push(`${counts.audio} audio`);
            if (counts.other) parts.push(`${counts.other} other`);
            folderStats.textContent = parts.join(' • ') || `${counts.all} files`;
        }

        /* ============================================================
           FILTER + SEARCH
           ============================================================ */
        function applyFilters() {
            let result = allFiles;

            if (currentFilter !== 'all') {
                result = result.filter(f => f.category === currentFilter);
            }

            if (searchQuery) {
                result = result.filter(f => f.name.toLowerCase().includes(searchQuery));
            }

            filteredFiles = result;
            renderFiles();
        }

        /* ============================================================
           RENDER
           ============================================================ */
        function renderFiles() {
            if (filteredFiles.length === 0) {
                fileGrid.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">Koi file nahi mili</div>
                        <div class="empty-sub">Try different filter ya search</div>
                    </div>
                `;
                fileList.innerHTML = '';
                return;
            }

            fileGrid.innerHTML = '';
            fileList.innerHTML = '';

            // Limit for performance — first 500
            const limit = 500;
            const toRender = filteredFiles.slice(0, limit);

            toRender.forEach((item, index) => {
                // Grid item
                const gridDiv = document.createElement('div');
                gridDiv.className = 'file-item';
                gridDiv.style.animationDelay = `${Math.min(index * 0.005, 0.3)}s`;

                if (item.category === 'image') {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = URL.createObjectURL(item.file);
                    img.onload = function() { URL.revokeObjectURL(this.src); };
                    gridDiv.appendChild(img);
                } else {
                    const icon = document.createElement('div');
                    icon.className = 'file-icon-big';
                    icon.textContent = getFileIcon(item.category, item.ext);
                    gridDiv.appendChild(icon);
                }

                const badge = document.createElement('div');
                badge.className = 'file-badge';
                badge.textContent = item.ext;
                gridDiv.appendChild(badge);

                gridDiv.addEventListener('click', () => handleFileClick(item));
                fileGrid.appendChild(gridDiv);
            });

            // List items
            toRender.forEach((item) => {
                const listDiv = document.createElement('div');
                listDiv.className = 'list-item';

                const iconDiv = document.createElement('div');
                iconDiv.className = 'list-icon';
                if (item.category === 'image') {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = URL.createObjectURL(item.file);
                    img.onload = function() { URL.revokeObjectURL(this.src); };
                    iconDiv.appendChild(img);
                } else {
                    iconDiv.textContent = getFileIcon(item.category, item.ext);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'list-info';
                infoDiv.innerHTML = `
                    <div class="list-name">${escapeHtml(item.name)}</div>
                    <div class="list-meta">
                        <span>${formatBytes(item.size)}</span>
                        <span class="dot">•</span>
                        <span>${formatDate(item.lastModified)}</span>
                    </div>
                `;

                listDiv.appendChild(iconDiv);
                listDiv.appendChild(infoDiv);
                listDiv.addEventListener('click', () => handleFileClick(item));
                fileList.appendChild(listDiv);
            });

            // Show limit warning
            if (filteredFiles.length > limit) {
                const warn = document.createElement('div');
                warn.style.cssText = 'grid-column:1/-1;text-align:center;padding:20px;color:#8e8e93;font-size:12px;';
                warn.textContent = `Showing first ${limit} of ${filteredFiles.length} files`;
                fileGrid.appendChild(warn);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* ============================================================
           FILE CLICK
           ============================================================ */
        function handleFileClick(item) {
            if (item.category === 'image') {
                // Show preview
                const url = URL.createObjectURL(item.file);
                previewImg.src = url;
                previewModal.classList.add('show');
            } else {
                showToast(`📄 ${item.name} • ${formatBytes(item.size)}`);
            }
        }

        previewClose.addEventListener('click', () => {
            previewModal.classList.remove('show');
            previewImg.src = '';
        });

        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                previewModal.classList.remove('show');
                previewImg.src = '';
            }
        });

        /* ============================================================
           FILTER CHIPS
           ============================================================ */
        chips.addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;

            chips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');

            currentFilter = chip.dataset.filter;
            applyFilters();
        });

        /* ============================================================
           SEARCH
           ============================================================ */
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = searchInput.value.trim().toLowerCase();
                applyFilters();
            }, 200);
        });

        /* ============================================================
           TOAST
           ============================================================ */
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* ============================================================
           INIT
           ============================================================ */
        console.log('✅ Folder Explorer ready');
    </script>
</body>
